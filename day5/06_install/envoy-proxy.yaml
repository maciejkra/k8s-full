# EnvoyProxy + GatewayClass override dla setupu DigitalOcean z tego katalogu (06_install).
#
# Problem: domyślnie Envoy Gateway wystawia data plane przez Service typu
# LoadBalancer. Na kubeadm bez cloud-controller-managera DO nie nada mu adresu —
# Service zostaje na zawsze w EXTERNAL-IP=<pending>. Ruch z internetu wchodzi
# przez `control-plane-lb` z terraform/main.tf, który forwarduje 80/443 na
# droplety otagowane `control-plane`.
#
# Rozwiązanie: Service typu NodePort ze stałymi portami 30080/30443, a DO LB
# celuje w te porty (target_port w terraform/main.tf). Data plane jako DaemonSet
# przypięty do CP nodes, bo Envoy Gateway ustawia na Service
# `externalTrafficPolicy: Local` — odpowiada tylko node, na którym jest Pod.
# LB celuje wyłącznie w droplety otagowane `control-plane`, więc na każdym z nich
# musi stać Pod Envoya (przy zwykłym Deployment ruch przez LB dostaje connection
# refused ze wszystkich CP poza tym jednym, gdzie akurat wylądował Pod).
#
# DLACZEGO NIE hostNetwork: Cilium instaluje własny DaemonSet `cilium-envoy`,
# który działa z hostNetwork i trzyma abstrakcyjne gniazdo
# `@envoy_domain_socket_parent_0` (base_id=0 Envoya). Drugi Envoy w przestrzeni
# nazw sieci hosta nie zbinduje tej nazwy i wpada w CrashLoopBackOff:
#   unable to bind domain socket with base_id=0, id=0, errno=98
#
# DLACZEGO NIE hostPort: Cilium implementuje hostPort dopiero z włączonym
# kubeProxyReplacement. Tutaj działa zwykły kube-proxy, w /etc/cni/net.d nie ma
# plugina `portmap`, więc Pody wstają, ale na hoście NIC nie nasłuchuje na :80.
#
# Apply po instalacji Envoy Gateway — patrz README, sekcja „Gateway API".
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: control-plane-envoy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # DaemonSet zamiast Deployment — jeden Pod na każdy CP node.
      envoyDaemonSet:
        pod:
          # Pozwala schedulować na CP mimo NoSchedule taintu kubeadm.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Wymusza schedule TYLKO na CP — worker nie dostaje Pod'a.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
      envoyService:
        type: NodePort
        # Stałe nodePorty — muszą się zgadzać z target_port w terraform/main.tf.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
                - name: https-443
                  port: 443
                  nodePort: 30443
---
# Override default GatewayClass `eg` (z day2/07_gateway_api/gateway-http.yaml).
# Dodajemy parametersRef żeby Envoy Gateway controller użył naszej EnvoyProxy
# (NodePort) zamiast default LoadBalancer.
#
# UWAGA: Jeśli zaaplikujesz `kubectl apply -f gateway-http.yaml` z D2/07,
# nadpisze on GatewayClass `eg` bez parametersRef. Wtedy re-apply tego pliku:
# `kubectl apply -f envoy-proxy.yaml` — przywraca parametersRef.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: control-plane-envoy
    namespace: envoy-gateway-system
