# UWAGA: adresy niżej są z poprzedniego szkolenia — PRZED `kubeadm init` podmień je
# na adresy swoich node'ów (`terraform output`, `doctl compute droplet list`).
# Dotyczy: advertiseAddress (prywatny IP cpnode1) oraz certSANs na dole pliku.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: "10.135.0.5"      # ZMIEŃ — prywatny IP cpnode1
nodeRegistration:
  ignorePreflightErrors:
    - FileContent--proc-sys-net-bridge-bridge-nf-call-iptables
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
clusterName: "workshops"
networking:
  serviceSubnet: "10.96.0.0/16"
  podSubnet: "10.244.0.0/16"
  dnsDomain: "cluster.local"
kubernetesVersion: "v1.36.4"
controlPlaneEndpoint: "kubeapi.example.com:6443"
scheduler:
  extraArgs:
    - name: "bind-address"
      value: "0.0.0.0"
controllerManager:
  extraArgs:
    - name: "v"
      value: "2"
    - name: "bind-address"
      value: "0.0.0.0"
apiServer:
  extraArgs:
    - name: "authorization-mode"
      value: "Node,RBAC"
    - name: "audit-policy-file"
      value: "/etc/kubernetes/audit-policy.yaml"
    - name: "audit-log-path"
      value: "/var/log/kubernetes/audit/audit.log"
    - name: "audit-log-maxbackup"
      value: "3"
    - name: "audit-log-maxsize"
      value: "10"
    - name: "audit-log-compress"
      value: "true"
    - name: "encryption-provider-config"
      value: "/etc/kubernetes/enc.yaml"
    - name: "event-ttl"
      value: "24h0m0s"
  extraVolumes:
    - name: "auditdir"
      hostPath: "/var/log/kubernetes/audit/"
      mountPath: "/var/log/kubernetes/audit/"
      readOnly: false
      pathType: DirectoryOrCreate
    - name: "auditfile"
      hostPath: "/etc/kubernetes/audit-policy.yaml"
      mountPath: "/etc/kubernetes/audit-policy.yaml"
      readOnly: true
      pathType: File
    - name: "encryption"
      hostPath: "/etc/kubernetes/enc.yaml"
      mountPath: "/etc/kubernetes/enc.yaml"
      readOnly: true
      pathType: File
  # ZMIEŃ wszystkie poniższe na adresy swoich node'ów.
  # Tu wpisujemy adresy, pod którymi ktoś łączy się DO apiservera — adresy workerów
  # są zbędne, bo nikt się do nich nie łączy.
  certSANs:
    # === IP LoadBalancera DO — BEZ TEGO PADNIE CILIUM ===
    # To jest cel controlPlaneEndpoint i to samo IP podajesz jako k8sServiceHost.
    # Jeśli go tu zabraknie, kubeadm init przejdzie bez słowa, a dopiero instalacja
    # Cilium stanie na Init:0/6 z `x509: certificate is valid for ..., not <IP LB>`.
    - "139.59.205.196"
    # nazwa domenowa tego samego endpointu (z pliku hosts)
    - "kubeapi.example.com"
    # prywatne IP trzech CP
    - "10.135.0.5"
    - "10.135.0.7"
    - "10.135.0.3"
    # VIP kube-vip
    - "10.135.0.100"
    # publiczne IP trzech CP (żeby dobić się kubectl z laptopa wprost w node)
    - "165.22.81.139"
    - "167.71.53.137"
    - "161.35.66.7"
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
readOnlyPort: 0
authentication:
  anonymous:
    enabled: false
authorization:
  mode: Webhook
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
mode: iptables
metricsBindAddress: 0.0.0.0:10249