kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  # NodePort mapping — Kind nie ma cloud-providera, dataplane Envoy działa
  # przez Service NodePort 30080/30443 (patrz day2/07_gateway_api/envoyproxy-kind.yaml).
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
  - containerPort: 30443
    hostPort: 443
- role: worker
  extraPortMappings:
  - containerPort: 32000
    hostPort: 32000
  extraMounts:
  - hostPath: /Users/jamicque/Downloads
    containerPath: /files
- role: worker
- role: worker


