apiVersion: v1
kind: Service
metadata:
  name: stsf-service
spec:
  clusterIP: None        # headless — daje per-Pod DNS: nginx-stsf-N.stsf-service.default.svc
  selector:
    app: stsf
  ports:
  - protocol: TCP
    port: 80
    name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-stsf
  labels:
    app: stsf
spec:
  serviceName: stsf-service
  replicas: 5
  selector:
    matchLabels:
      app: stsf
  template:
    metadata:
      labels:
        app: stsf
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
          - containerPort: 80
            name: http
        volumeMounts:
        - name: nginx-html
          mountPath: /usr/share/nginx/html    # poprawna ścieżka serwowania dla nginx (nie /usr/local)
  volumeClaimTemplates:
  - metadata:
      name: nginx-html
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
