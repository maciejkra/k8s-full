# Generic Secret (Opaque) — dowolne klucz-wartość.
# stringData = raw wartości (K8s sam base64-uje przed zapisem do etcd).
# Alternatywa: data = wartości już zbase64-owane (niewygodne, ale wymuszane przez API).
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  labels:
    app: demo
type: Opaque
# immutable: true  # opcjonalne — Secret nie da się modyfikować. Tylko delete+recreate.
                   # Wydajnościowo: K8s nie musi watchować immutable Secrets → mniejsze obciążenie API serwera
                   # w klastrach z dużą ilością Secrets.
stringData:
  db-user: admin
  db-password: "supersecret-change-me"
  api-key: "change-me-also"
