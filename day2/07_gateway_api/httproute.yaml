# HTTPRoute dla demo TLS/Let's Encrypt — kieruje do python-api (D1/11) na publicznej domenie nip.io
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: python-tls
spec:
  parentRefs:
    - name: training-gateway
  hostnames:
    - python.<GATEWAY-IP>.nip.io   # ZMIEŃ — musi się zgadzać z certificate.yaml
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: python-service
          port: 80
