# URLRewrite filter — migracja legacy ścieżki /old-api → /api bez dotykania backendu.
# Uwaga: ten HTTPRoute koegzystuje z demo-uri (ten sam hostname) — Envoy Gateway wybiera
# bardziej specyficzny match, więc /old-api/* trafi tu, reszta nadal do demo-uri.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-rewrite
spec:
  parentRefs:
    - name: training-gateway
  hostnames:
    - demo.127-0-0-1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /old-api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: python-service
          port: 80
