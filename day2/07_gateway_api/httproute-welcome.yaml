# Catch-all welcome route — bez `hostnames` → matchuje KAŻDY Host header
# (localhost, 127.0.0.1, dowolny <foo>.nip.io). Backend: demo-app (nginx).
#
# Cel: po setup-ie `curl http://localhost/` daje "to działa", bez czekania
# na Przykład 1 / nip.io DNS. Współistnieje z httproute-uri.yaml /
# httproute-domain.yaml — Gateway API stosuje most-specific-match, więc
# reguły z konkretnym hostname wygrywają nad tym catch-all dla swoich domen.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: welcome
spec:
  parentRefs:
    - name: training-gateway
  rules:
    - backendRefs:
        - name: demo-app
          port: 80
